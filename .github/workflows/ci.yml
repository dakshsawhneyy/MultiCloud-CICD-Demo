name: NodeJs CI

# Event
on: 
  push: 
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup NodeJS
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
  demo-2:
    needs: demo
    runs-on: ubuntu-latest
    steps:
